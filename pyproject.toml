[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-cv"
version = "0.1.1"
description = "Access tools and software for fast and efficient calculation and visualization of your trades at real-time prices."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "MrBootes"}, {name = "Victor Golub"}]
keywords = ["trading", "investments", "portfolio-analysis", "investment-analysis"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "plotly>=5.0",
  "requests>=2.0",
  "tqdm>=4.0",
  "openpyxl>=3.1",
  "python-dateutil>=2.8",
]

[project.scripts]
trade-cv = "main_workers.main_calc:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
